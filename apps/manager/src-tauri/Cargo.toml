[package]
name = "meow-manager"
version = "26.1.0-snapshot-1"
edition = "2021"

[build-dependencies]
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
meow-launcher-core = { path = "../../../packages/launcher-core" }
open = "5"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde_json = "1"
sha2 = "0.10"
rfd = "0.15"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
